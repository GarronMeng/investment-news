<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark light"><title>Garron 数据健康检查</title>
<style>
:root{color-scheme:dark;--bg:#070b12;--panel:#0e1520;--panel2:#111b28;--line:#223047;--text:#edf4fb;--muted:#8d9cb0;--good:#69d6a3;--warn:#f2b45f;--bad:#ff6675;--accent:#69a6ff}:root[data-theme=light]{color-scheme:light;--bg:#f4f6f9;--panel:#fff;--panel2:#f8fafc;--line:#dce4ee;--text:#172033;--muted:#667085;--good:#208660;--warn:#9b6706;--bad:#c53f4d;--accent:#2468c9}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.shell{max-width:1320px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:12px}.top h1{font-size:24px;margin:0}.muted{color:var(--muted)}.actions{display:flex;gap:7px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:8px;padding:7px 10px;text-decoration:none;cursor:pointer}.panel{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:14px;margin-bottom:12px}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:10px}.stat b{display:block;font-size:20px}.stat span{font-size:10px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.card{border:1px solid var(--line);background:var(--panel2);border-radius:11px;padding:11px}.card-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.card h3{font-size:14px;margin:0}.pill{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px 7px;font-size:10px}.pill.ok{color:var(--good)}.pill.warn{color:var(--warn)}.pill.bad{color:var(--bad)}.meta{font-size:11px;color:var(--muted);margin-top:5px}.checks{display:grid;gap:7px}.check{border-left:3px solid var(--line);background:var(--panel2);border-radius:8px;padding:8px 10px}.check.ok{border-color:var(--good)}.check.warn{border-color:var(--warn)}.check.bad{border-color:var(--bad)}.check b{font-size:12px}.check span{display:block;font-size:11px;color:var(--muted)}.warn-list{font-size:11px;color:var(--muted);white-space:pre-wrap;word-break:break-word}.foot{font-size:11px;color:var(--muted)}dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--text);max-width:760px;width:calc(100% - 30px)}textarea{width:100%;height:390px;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:9px}@media(max-width:780px){.summary{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.top{display:block}.actions{margin-top:8px}}@media(max-width:430px){.shell{padding:10px}.summary{grid-template-columns:1fr 1fr}}
</style><script>(()=>{try{document.documentElement.dataset.theme=localStorage.getItem('garron-workbench-theme')||((matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark')}catch(e){}})()</script><script src="data.js"></script><script src="ai-signals.js"></script></head><body><div class="shell"><div class="top"><div><h1>数据健康与诊断</h1><div class="muted">检查来源新鲜度、跨文件时间戳一致性、stale/unavailable 与上游告警。只读取公开文件。</div></div><div class="actions"><a class="btn" href="index.html">返回驾驶舱</a><a class="btn" href="dashboard-v3.html">完整工作台</a><button class="btn" id="refresh">重新检查</button><button class="btn" id="export">导出诊断</button></div></div>
<section class="panel"><div class="summary" id="summary"></div></section>
<section class="panel"><h2 style="font-size:17px;margin-top:0">数据层</h2><div class="grid" id="layers"></div></section>
<section class="panel"><h2 style="font-size:17px;margin-top:0">一致性检查</h2><div class="checks" id="checks"></div></section>
<section class="panel"><h2 style="font-size:17px;margin-top:0">上游告警</h2><div class="warn-list" id="warnings"></div></section>
<div class="foot">健康页是浏览器加载时的诊断快照。时间阈值用于发现异常，不代表市场数据必须在休市期间持续刷新；跨交易日判断以 Research Engine 的 benchmark-date alignment 为准。私人组合 localStorage 不会进入本页诊断或导出。</div></div>
<dialog id="dlg"><h3>公开系统诊断 JSON</h3><p class="muted">不含 portfolio.html 的本地持仓数据。</p><textarea id="out" readonly></textarea><div class="actions" style="margin-top:8px"><button class="btn" id="close">关闭</button></div></dialog>
<script>
const $=id=>document.getElementById(id);let report={};const specs={
market:{path:'market.json',label:'自选实时行情',warn:18,bad:72},marketState:{path:'market_state.json',label:'市场状态',warn:18,bad:72},history:{path:'market_history.json',label:'日线历史',warn:36,bad:96},features:{path:'features.json',label:'量价特征',warn:36,bad:96},technical:{path:'technical.json',label:'技术条件',warn:36,bad:96},valuation:{path:'valuation.json',label:'指数估值',warn:72,bad:168},risk:{path:'risk_score.json',label:'风险温度',warn:36,bad:96},decisions:{path:'decisions.json',label:'基础研究决策',warn:36,bad:96},matrix:{path:'decision_matrix.json',label:'Decision Matrix',warn:36,bad:96},sentiment:{path:'sentiment.json',label:'情绪/两融',warn:72,bad:168},evaluation:{path:'signal_evaluation.json',label:'前向评价',warn:72,bad:168}};
function parseTime(v){if(!v)return null;let s=String(v).replace(' ','T');if(!/[zZ]|[+-]\d\d:?\d\d$/.test(s))s+='+08:00';const d=new Date(s);return Number.isNaN(d.getTime())?null:d}function ageHours(v){const d=parseTime(v);return d?(Date.now()-d.getTime())/36e5:null}function state(age,s){if(age==null)return 'bad';if(age>s.bad)return 'bad';if(age>s.warn)return 'warn';return 'ok'}function statusWord(x){return x==='ok'?'OK':x==='warn'?'WARNING':'STALE/ERROR'}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function get(path){try{const r=await fetch(path,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);return await r.json()}catch(e){return {__error:String(e)}}}
function generated(x){return x?.generated_at||x?.source_generated_at||null}function itemStatus(x){if(x?.__error)return 'bad';const statuses=[];if(Array.isArray(x?.quotes))statuses.push(...x.quotes.map(q=>q.status));if(x?.section_status)statuses.push(...Object.values(x.section_status).map(v=>v?.status));if(x?.summary?.stale)statuses.push('stale');if(x?.summary?.unavailable)statuses.push('unavailable');if(statuses.includes('unavailable'))return 'bad';if(statuses.includes('stale'))return 'warn';return null}
function check(name,ok,detail,warn=false){return {name,state:ok?'ok':warn?'warn':'bad',detail}}
async function run(){const entries=await Promise.all(Object.entries(specs).map(async([k,s])=>[k,await get(s.path)]));const files=Object.fromEntries(entries);const DATA=window.DATA||{},AI=window.AI_SIGNALS||{};const layerRows=[];let ok=0,warn=0,bad=0;const bump=st=>{if(st==='ok')ok++;else if(st==='warn')warn++;else bad++};for(const[k,s]of Object.entries(specs)){const x=files[k],time=generated(x),age=ageHours(time);let st=x.__error?'bad':state(age,s);const intrinsic=itemStatus(x);if(intrinsic==='bad')st='bad';else if(intrinsic==='warn'&&st==='ok')st='warn';bump(st);layerRows.push({key:k,label:s.label,path:s.path,time,age,state:st,error:x.__error||null});}
const dataTime=DATA.generated_at||null,aiTime=AI.generated_at||null,dataAge=ageHours(dataTime),aiAge=ageHours(aiTime);for(const row of [{key:'data',label:'产业新闻 data.js',path:'data.js',time:dataTime,age:dataAge,state:state(dataAge,{warn:36,bad:72})},{key:'ai',label:'AI 事件信号',path:'ai-signals.js',time:aiTime,age:aiAge,state:AI.status==='stale'?'bad':state(aiAge,{warn:36,bad:72})}]){bump(row.state);layerRows.push(row)}
const hist=files.history||{},tech=files.technical||{},dec=files.decisions||{},mat=files.matrix||{};const checks=[];checks.push(check('AI ↔ 新闻源',AI.source_generated_at&&DATA.generated_at&&AI.source_generated_at===DATA.generated_at,`AI source=${AI.source_generated_at||'—'}；data=${DATA.generated_at||'—'}`));checks.push(check('技术 ↔ 日线历史',tech.source_generated_at&&hist.generated_at&&tech.source_generated_at===hist.generated_at,`technical source=${tech.source_generated_at||'—'}；history=${hist.generated_at||'—'}`));checks.push(check('矩阵 ↔ 基础决策',mat.generated_at&&dec.generated_at&&mat.generated_at>=dec.generated_at,`matrix=${mat.generated_at||'—'}；decisions=${dec.generated_at||'—'}`));const benchmarkDate=hist.benchmark?.last_date||null,assets=Object.values(tech.assets||{}),lagging=benchmarkDate?assets.filter(x=>x.as_of&&x.as_of<benchmarkDate):[];checks.push(check('资产交易日对齐',benchmarkDate&&lagging.length===0,`benchmark=${benchmarkDate||'—'}；落后资产=${lagging.map(x=>x.name).join('、')||'无'}`));const expected=(files.matrix?.summary?.total??0),rank=(files.matrix?.ranking||[]).length;checks.push(check('Decision Matrix 覆盖',expected>0&&rank===expected,`matrix total=${expected}；ranking=${rank}`));const privacyBad=Object.values(files.matrix?.assets||{}).some(x=>['quantity','cost_basis','position_size','buy','sell','stop_loss'].some(k=>k in x));checks.push(check('公共矩阵隐私边界',!privacyBad,privacyBad?'发现禁止字段':'未发现持仓/成本/买卖字段'));
const warningLines=[];for(const key of ['marketState','history'])for(const w of files[key]?.warnings||[])warningLines.push(`${specs[key].label}: ${w}`);if(AI.freshness_error)warningLines.push(`AI: ${AI.freshness_error}`);report={checked_at:new Date().toISOString(),summary:{ok,warn,bad},layers:layerRows,checks,warnings:warningLines};$('summary').innerHTML=[['OK',ok,'ok'],['Warning',warn,'warn'],['Stale/Error',bad,'bad'],['检查时间',new Date().toLocaleTimeString('zh-CN',{hour12:false}),'']].map(x=>`<div class="stat"><b class="${x[2]}">${esc(x[1])}</b><span>${esc(x[0])}</span></div>`).join('');$('layers').innerHTML=layerRows.map(x=>`<div class="card"><div class="card-top"><div><h3>${esc(x.label)}</h3><div class="meta">${esc(x.path)}</div></div><span class="pill ${x.state}">${statusWord(x.state)}</span></div><div class="meta">时间 ${esc(x.time||'—')} · age ${x.age==null?'—':x.age.toFixed(1)+'h'}</div>${x.error?`<div class="meta" style="color:var(--bad)">${esc(x.error)}</div>`:''}</div>`).join('');$('checks').innerHTML=checks.map(x=>`<div class="check ${x.state}"><b>${esc(x.name)}</b><span>${esc(x.detail)}</span></div>`).join('');$('warnings').textContent=warningLines.length?warningLines.join('\n'):'当前文件未报告上游 warning。'}
$('refresh').onclick=()=>location.reload();$('export').onclick=()=>{$('out').value=JSON.stringify(report,null,2);$('dlg').showModal()};$('close').onclick=()=>$('dlg').close();run();
</script></body></html>
