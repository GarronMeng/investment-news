<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark light"><title>Garron 私人组合层</title><style>
:root{color-scheme:dark;--bg:#070b12;--panel:#0e1520;--panel2:#111b28;--line:#223047;--text:#edf4fb;--muted:#8d9cb0;--up:#ff6675;--down:#45c7c4;--warn:#f2b45f;--accent:#69a6ff;--good:#69d6a3}:root[data-theme=light]{color-scheme:light;--bg:#f4f6f9;--panel:#fff;--panel2:#f8fafc;--line:#dce4ee;--text:#172033;--muted:#667085;--up:#c53f4d;--down:#138680;--warn:#9b6706;--accent:#2468c9;--good:#208660}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.shell{max-width:1320px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:13px}.top h1{margin:0;font-size:24px}.muted{color:var(--muted)}.actions{display:flex;gap:7px;flex-wrap:wrap}.btn,input,select{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:8px;padding:8px 10px}.btn{text-decoration:none;cursor:pointer}.panel{border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:14px;margin-bottom:12px}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.stat{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px}.stat b{display:block;font-size:19px}.stat span{font-size:11px;color:var(--muted)}.form{display:grid;grid-template-columns:120px 1fr repeat(4,130px) auto;gap:7px;align-items:end}.field label{display:block;font-size:10px;color:var(--muted);margin-bottom:4px}.field input,.field select{width:100%}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:920px}th,td{text-align:right;border-top:1px solid var(--line);padding:9px 8px;white-space:nowrap}th{font-size:11px;color:var(--muted);font-weight:600}th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left}.up{color:var(--up)}.down{color:var(--down)}.warn{color:var(--warn)}.good{color:var(--good)}.pill{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px 7px;font-size:10px;color:var(--muted)}.risk-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.risk{border-left:3px solid var(--line);background:var(--panel2);border-radius:9px;padding:10px}.risk.warn{border-color:var(--warn)}.risk.good{border-color:var(--good)}.risk b{display:block}.empty{color:var(--muted);padding:12px 0}.foot{font-size:11px;color:var(--muted)}dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--text);max-width:600px;width:calc(100% - 30px)}textarea{width:100%;height:280px;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:9px}@media(max-width:900px){.stats{grid-template-columns:repeat(3,1fr)}.form{grid-template-columns:repeat(2,1fr)}.risk-grid{grid-template-columns:1fr}}@media(max-width:520px){.shell{padding:10px}.top{display:block}.actions{margin-top:9px}.stats{grid-template-columns:repeat(2,1fr)}.form{grid-template-columns:1fr}}
</style><script>(()=>{try{document.documentElement.dataset.theme=localStorage.getItem('garron-workbench-theme')||((matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark')}catch(e){}})()</script></head><body><div class="shell"><div class="top"><div><h1>私人组合层</h1><div class="muted">持仓只保存在当前浏览器 localStorage，不写入 GitHub、Pages 数据文件或任何远端接口。</div></div><div class="actions"><a class="btn" href="index.html">返回工作台</a><button class="btn" id="ioBtn">导入 / 导出</button><button class="btn" id="clearBtn">清空本机持仓</button></div></div>
<section class="panel"><div class="stats" id="stats"></div></section>
<section class="panel"><h2 style="margin-top:0;font-size:17px">新增 / 更新持仓</h2><div class="form"><div class="field"><label>代码</label><input id="code" inputmode="numeric" maxlength="6" placeholder="如 517380"></div><div class="field"><label>名称</label><input id="name" placeholder="可自动匹配自选"></div><div class="field"><label>数量</label><input id="qty" type="number" step="any" min="0"></div><div class="field"><label>成本价</label><input id="cost" type="number" step="any" min="0"></div><div class="field"><label>手动现价（可空）</label><input id="manual" type="number" step="any" min="0"></div><div class="field"><label>分组</label><input id="group" placeholder="如 核心 / 对冲"></div><button class="btn" id="saveBtn">保存</button></div><div class="muted" style="font-size:11px;margin-top:8px">若代码存在于公开 watchlist 行情，现价自动取 market.json；“手动现价”仅作为无法匹配时的本地备用。</div></section>
<section class="panel"><div style="display:flex;justify-content:space-between;gap:10px"><h2 style="margin:0;font-size:17px">组合明细</h2><span class="muted" id="quoteStamp"></span></div><div class="table-wrap"><table><thead><tr><th>标的</th><th>分组</th><th>数量</th><th>成本</th><th>现价</th><th>市值</th><th>浮盈亏</th><th>收益率</th><th>组合权重</th><th></th></tr></thead><tbody id="body"></tbody></table></div></section>
<section class="panel"><h2 style="margin-top:0;font-size:17px">组合诊断</h2><div class="risk-grid" id="risks"></div></section><div class="foot">这层只做组合算术、集中度和数据完整性检查，不从成本价自动生成买卖建议。刷新/清理浏览器数据可能丢失本地持仓；如需跨设备使用，先导出 JSON 自行保管。</div></div>
<dialog id="io"><h3>本地组合 JSON</h3><p class="muted">导出内容会包含持仓数量与成本；只在你自行保存的位置存在。</p><textarea id="jsonText"></textarea><div class="actions" style="margin-top:8px"><button class="btn" id="exportBtn">生成导出内容</button><button class="btn" id="importBtn">导入并覆盖</button><button class="btn" id="closeBtn">关闭</button></div></dialog>
<script>
const KEY='garron-private-portfolio-v1',$=id=>document.getElementById(id),num=(v,d=2)=>Number.isFinite(Number(v))?Number(v).toLocaleString('zh-CN',{minimumFractionDigits:d,maximumFractionDigits:d}):'—',pct=v=>Number.isFinite(Number(v))?`${Number(v)>0?'+':''}${Number(v).toFixed(2)}%`:'—',money=v=>Number.isFinite(Number(v))?'¥'+Number(v).toLocaleString('zh-CN',{maximumFractionDigits:2}):'—';let market={},watch={};function loadLocal(){try{const p=JSON.parse(localStorage.getItem(KEY)||'{"cash":0,"positions":[]}');return Array.isArray(p.positions)?p:{cash:0,positions:[]}}catch(e){return{cash:0,positions:[]}}}function saveLocal(p){localStorage.setItem(KEY,JSON.stringify(p))}function quote(code,manual){const q=(market.quotes||[]).find(x=>String(x.code)===String(code));return q?.price??(Number.isFinite(Number(manual))&&Number(manual)>0?Number(manual):null)}function witem(code){return(watch.assets||[]).find(x=>String(x.code)===String(code))}function render(){const p=loadLocal(),rows=p.positions.map(x=>{const pr=quote(x.code,x.manual_price),mv=pr==null?null:pr*x.quantity,cb=x.cost*x.quantity,pnl=mv==null?null:mv-cb,ret=pnl==null||cb===0?null:pnl/cb*100;return{...x,price:pr,mv,cb,pnl,ret}}),marketValue=rows.reduce((s,x)=>s+(x.mv||0),0),cost=rows.reduce((s,x)=>s+x.cb,0),pnl=marketValue-cost,total=marketValue+(Number(p.cash)||0);$('stats').innerHTML=[['组合市值',money(marketValue)],['持仓成本',money(cost)],['浮动盈亏',money(pnl)],['组合收益率',cost?pct(pnl/cost*100):'—'],['本地现金',money(p.cash||0)],['总资产口径',money(total)]].map(x=>`<div class="stat"><b>${x[1]}</b><span>${x[0]}</span></div>`).join('');$('body').innerHTML=rows.length?rows.map(x=>`<tr><td><b>${x.name}</b><div class="muted" style="font-size:10px">${x.code}</div></td><td>${x.group||'—'}</td><td>${num(x.quantity,0)}</td><td>${num(x.cost,3)}</td><td>${num(x.price,3)}</td><td>${money(x.mv)}</td><td class="${x.pnl>0?'up':x.pnl<0?'down':''}">${money(x.pnl)}</td><td class="${x.ret>0?'up':x.ret<0?'down':''}">${pct(x.ret)}</td><td>${total&&x.mv!=null?pct(x.mv/total*100):'—'}</td><td><button class="btn" data-del="${x.code}" style="padding:4px 7px">删除</button></td></tr>`).join(''):'<tr><td colspan="10"><div class="empty">本机尚未录入持仓</div></td></tr>';document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{const n=loadLocal();n.positions=n.positions.filter(x=>x.code!==b.dataset.del);saveLocal(n);render()});const valid=rows.filter(x=>x.mv!=null),weights=valid.map(x=>({name:x.name,w:total?x.mv/total:0})).sort((a,b)=>b.w-a.w),top=weights[0],missing=rows.filter(x=>x.price==null);const groupMap={};valid.forEach(x=>groupMap[x.group||'未分组']=(groupMap[x.group||'未分组']||0)+x.mv);const topGroup=Object.entries(groupMap).sort((a,b)=>b[1]-a[1])[0];const diag=[];diag.push({tone:top&&top.w>.3?'warn':'good',title:'单一标的集中度',text:top?`${top.name} ${pct(top.w*100)}${top.w>.3?'，超过30%观察阈值':'，未超过30%观察阈值'}`:'暂无持仓'});diag.push({tone:topGroup&&total&&topGroup[1]/total>.5?'warn':'good',title:'分组集中度',text:topGroup?`${topGroup[0]} ${pct(topGroup[1]/total*100)}`:'暂无分组'});diag.push({tone:missing.length?'warn':'good',title:'行情完整性',text:missing.length?`${missing.length} 个标的缺少可核验现价：${missing.map(x=>x.name).join('、')}`:'全部持仓有当前/手动价格'});$('risks').innerHTML=diag.map(x=>`<div class="risk ${x.tone}"><b>${x.title}</b><div class="muted">${x.text}</div></div>`).join('');$('quoteStamp').textContent=`公开行情 ${market.generated_at||'未加载'}`}
$('code').onchange=()=>{const a=witem($('code').value.trim());if(a&&!$('name').value)$('name').value=a.name;if(a&&!$('group').value)$('group').value=a.group||''};$('saveBtn').onclick=()=>{const code=$('code').value.trim(),qty=Number($('qty').value),cost=Number($('cost').value);if(!code||!Number.isFinite(qty)||qty<=0||!Number.isFinite(cost)||cost<0){alert('请填写有效代码、数量和成本价');return}const a=witem(code),p=loadLocal(),item={code,name:$('name').value.trim()||a?.name||code,quantity:qty,cost,manual_price:Number($('manual').value)||null,group:$('group').value.trim()||a?.group||''},i=p.positions.findIndex(x=>x.code===code);if(i>=0)p.positions[i]=item;else p.positions.push(item);saveLocal(p);render()};$('ioBtn').onclick=()=>{$('jsonText').value='';$('io').showModal()};$('closeBtn').onclick=()=>$('io').close();$('exportBtn').onclick=()=>$('jsonText').value=JSON.stringify(loadLocal(),null,2);$('importBtn').onclick=()=>{try{const p=JSON.parse($('jsonText').value);if(!p||!Array.isArray(p.positions))throw Error('positions missing');saveLocal({cash:Number(p.cash)||0,positions:p.positions});$('io').close();render()}catch(e){alert('JSON 格式无效：'+e.message)}};$('clearBtn').onclick=()=>{if(confirm('确认清空当前浏览器中的私人组合数据？此操作无法从 GitHub 恢复。')){localStorage.removeItem(KEY);render()}};Promise.all([fetch('market.json',{cache:'no-store'}).then(r=>r.json()).catch(()=>({})),fetch('watchlist.json',{cache:'no-store'}).then(r=>r.json()).catch(()=>({}))]).then(([m,w])=>{market=m;watch=w;render()});
</script></body></html>
