name: Update Daily Flash

on:
  workflow_dispatch:
  schedule:
    # Asia/Shanghai: 08:50 premarket and 15:55 after close, weekdays.
    - cron: "50 0 * * 1-5"
    - cron: "55 7 * * 1-5"
  workflow_run:
    workflows: ["Update Research Engine", "Update Watchlist Market Quotes", "Update A-share News", "Update Market Sentiment"]
    branches: [main]
    types: [completed]
  push:
    branches: [main]
    paths:
      - catalysts_manual.json
      - global_catalyst_universe.json
      - theme_earnings_universe.json
      - scripts/fetch_global_markets.py
      - scripts/fetch_catalysts.py
      - scripts/fetch_market_extras.py
      - scripts/fetch_macro_calendar.py
      - scripts/fetch_theme_earnings.py
      - scripts/build_daily_flash.py
      - scripts/augment_daily_flash_extras.py
      - scripts/augment_daily_flash_intelligence.py
      - scripts/finalize_daily_flash.py
      - tests/test_daily_flash.py
      - tests/test_market_extras.py
      - tests/test_macro_calendar.py
      - tests/test_theme_earnings.py
      - .github/workflows/update-daily-flash.yml

permissions:
  contents: write

concurrency:
  group: investment-daily-flash
  cancel-in-progress: true

jobs:
  update:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-sentiment.txt

      - name: Install market provider
        run: python -m pip install "akshare>=1.18,<2"

      - name: Test Daily Flash contracts
        run: |
          python -m unittest tests/test_daily_flash.py -v
          python -m unittest tests/test_market_extras.py -v
          python -m unittest tests/test_macro_calendar.py -v
          python -m unittest tests/test_theme_earnings.py -v

      - name: Refresh cross-asset markets
        run: python scripts/fetch_global_markets.py

      - name: Refresh market extras
        run: python scripts/fetch_market_extras.py

      - name: Refresh A-share catalyst calendar
        run: python scripts/fetch_catalysts.py

      - name: Refresh macro and global catalyst calendar
        run: python scripts/fetch_macro_calendar.py

      - name: Refresh theme earnings breadth
        run: python scripts/fetch_theme_earnings.py

      - name: Build Daily Flash
        run: python scripts/build_daily_flash.py

      - name: Attach leverage and futures context
        run: python scripts/augment_daily_flash_extras.py

      - name: Finalize Daily Flash integrity
        run: python scripts/finalize_daily_flash.py

      - name: Attach macro and theme intelligence
        run: python scripts/augment_daily_flash_intelligence.py

      - name: Validate Daily Flash
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          BEIJING = timezone(timedelta(hours=8))
          today = datetime.now(BEIJING).date()
          flash = json.load(open("daily_flash.json", encoding="utf-8"))
          global_markets = json.load(open("global_markets.json", encoding="utf-8"))
          catalysts = json.load(open("catalysts.json", encoding="utf-8"))
          extras = json.load(open("market_extras.json", encoding="utf-8"))
          macro = json.load(open("macro_calendar.json", encoding="utf-8"))
          theme = json.load(open("theme_earnings.json", encoding="utf-8"))
          assert flash.get("version") == 1
          assert global_markets.get("version") == 1
          assert catalysts.get("version") == 1
          assert extras.get("version") == 1
          assert macro.get("version") == 1
          assert theme.get("version") == 1
          for key in ("core_conclusion", "market", "sector_rotation", "global_markets", "key_events", "catalysts", "dimensions", "themes", "outlook", "matrix_focus", "macro_calendar", "theme_earnings"):
              assert key in flash, key
          assert isinstance(flash.get("global_markets"), list)
          assert isinstance(flash.get("catalysts"), list)
          assert isinstance(flash.get("macro_calendar"), list)
          assert isinstance(flash.get("theme_earnings"), list)
          assert isinstance(flash.get("dimensions"), list)
          assert isinstance(flash.get("themes"), list)
          assert isinstance(flash.get("market", {}).get("funding_and_futures", {}).get("index_futures", []), list)
          assert flash.get("integrity", {}).get("status") == "ok", flash.get("integrity")
          assert 0 <= int(macro.get("summary", {}).get("macro_days_ok", 0)) <= 11
          assert 0 <= int(macro.get("summary", {}).get("report_days_ok", 0)) <= 11
          noise = ("每日更新", "每日仓单", "上期所每日", "SPDR黄金持仓", "iShares白银持仓", "iShares黄金持仓")
          for event in macro.get("events", []):
              assert not any(token in str(event.get("title") or "") for token in noise), f"routine macro noise leaked: {event.get('title')}"
          for theme_row in theme.get("themes", []):
              summary = theme_row.get("summary", {})
              assert int(summary.get("reported", 0)) <= int(summary.get("total", 0))
              for company in theme_row.get("companies", []):
                  if company.get("status") == "reported":
                      announced = company.get("announcement_date")
                      assert announced and datetime.fromisoformat(announced).date() <= today, f"future report leaked: {company}"
                  else:
                      assert company.get("revenue") is None
                      assert company.get("revenue_yoy_pct") is None
                      assert company.get("net_profit") is None
                      assert company.get("net_profit_yoy_pct") is None
          forbidden = {"quantity", "position_size", "buy", "sell", "cost_basis", "stop_loss"}
          assert not forbidden.intersection(flash), "private/trade fields leaked into Daily Flash"
          assert Path("dashboard-v5.html").exists()
          assert Path("daily-flash-extras.js").exists()
          assert Path("daily-flash-intelligence.js").exists()
          print("daily flash validated", flash.get("generated_at"), "global", global_markets.get("summary"), "catalysts", catalysts.get("summary"), "macro", macro.get("summary"), "theme earnings", theme.get("summary"), "southbound", extras.get("southbound", {}).get("net_buy_cny_100m"), "futures", len(extras.get("index_futures", [])), flash.get("integrity"))
          PY

      - name: Commit Daily Flash artifacts
        run: |
          git config user.name "investment-news-bot"
          git config user.email "investment-news-bot@users.noreply.github.com"
          git add global_markets.json market_extras.json catalysts.json macro_calendar.json theme_earnings.json daily_flash.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh Daily Flash"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push; then
              exit 0
            fi
            git rebase --abort || true
            echo "Push retry ${attempt}/3"
            sleep $((attempt * 5))
          done
          echo "::error::Unable to push Daily Flash artifacts after 3 attempts"
          exit 1
