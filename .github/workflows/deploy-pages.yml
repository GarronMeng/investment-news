name: Deploy dashboard to Pages

on:
  push:
    branches: [main]
    paths:
      - index.html
      - dashboard-v2.html
      - dashboard-v3.html
      - dashboard-v4.html
      - dashboard-v5.html
      - daily-flash-extras.js
      - daily-flash-intelligence.js
      - chart.html
      - portfolio.html
      - performance.html
      - health.html
      - research.html
      - data.js
      - ai-signals.js
      - sentiment.json
      - market.json
      - market_state.json
      - market_history.json
      - valuation.json
      - risk_score.json
      - decision_matrix.json
      - matrix_evaluation.json
      - global_markets.json
      - market_extras.json
      - catalysts.json
      - macro_calendar.json
      - theme_earnings.json
      - daily_flash.json
      - watchlist.json
      - features.json
      - technical.json
      - decisions.json
      - signal_evaluation.json
      - .nojekyll
      - .github/workflows/deploy-pages.yml
  workflow_run:
    workflows: ["Update A-share News", "Update Market Sentiment", "Update Watchlist Market Quotes", "Update Research Engine", "Update Daily Flash"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Prepare static site
        run: |
          mkdir public
          cp index.html public/classic.html
          cp dashboard-v2.html public/v2.html
          cp dashboard-v3.html public/dashboard-v3.html
          cp dashboard-v4.html public/dashboard-v4.html
          cp dashboard-v5.html public/index.html
          cp daily-flash-extras.js daily-flash-intelligence.js chart.html portfolio.html performance.html health.html research.html data.js ai-signals.js sentiment.json market.json market_state.json market_history.json valuation.json risk_score.json decision_matrix.json matrix_evaluation.json global_markets.json market_extras.json catalysts.json macro_calendar.json theme_earnings.json daily_flash.json watchlist.json features.json technical.json decisions.json signal_evaluation.json .nojekyll public/
          python - <<'PY'
          from pathlib import Path
          path = Path("public/index.html")
          text = path.read_text(encoding="utf-8")
          for tag in (
              '<script src="daily-flash-extras.js"></script>',
              '<script src="daily-flash-intelligence.js"></script>',
          ):
              if tag not in text:
                  text = text.replace("</body>", tag + "\n</body>")
          path.write_text(text, encoding="utf-8")
          PY

      - name: Enforce AI signal freshness
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          def load_js(path):
              text = Path(path).read_text(encoding="utf-8")
              return json.loads(text[text.index("{"):text.rindex("}") + 1])

          data = load_js("public/data.js")
          signals = load_js("public/ai-signals.js")
          data_generated = data.get("generated_at")
          source_generated = signals.get("source_generated_at")
          reasons = []

          if not data_generated or not source_generated:
              reasons.append("missing source timestamp")
          elif data_generated != source_generated:
              reasons.append(f"AI source {source_generated} != data {data_generated}")

          if data_generated:
              try:
                  observed = datetime.fromisoformat(str(data_generated).replace(" ", "T"))
                  if observed.tzinfo is None:
                      observed = observed.replace(tzinfo=timezone(timedelta(hours=8)))
                  age_hours = (datetime.now(timezone.utc) - observed.astimezone(timezone.utc)).total_seconds() / 3600
                  if age_hours > 36:
                      reasons.append(f"data age {age_hours:.1f}h > 36h")
              except ValueError:
                  reasons.append("invalid data timestamp")

          if reasons:
              signals["status"] = "stale"
              signals["freshness_error"] = "; ".join(reasons)
              signals["signals"] = []
              signals["overseas_markets"] = []
              signals["news_titles"] = {}
              Path("public/ai-signals.js").write_text(
                  "window.AI_SIGNALS = " + json.dumps(signals, ensure_ascii=False, indent=2) + ";\n",
                  encoding="utf-8",
              )
              print("AI signals suppressed:", signals["freshness_error"])
          else:
              print("AI signals freshness verified:", data_generated)
          PY

      - name: Validate public artifacts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          required = [
              "public/index.html", "public/dashboard-v3.html", "public/dashboard-v4.html", "public/daily-flash-extras.js", "public/daily-flash-intelligence.js", "public/chart.html", "public/portfolio.html", "public/performance.html", "public/health.html", "public/research.html",
              "public/market_state.json", "public/valuation.json", "public/risk_score.json", "public/decision_matrix.json", "public/matrix_evaluation.json",
              "public/global_markets.json", "public/market_extras.json", "public/catalysts.json", "public/macro_calendar.json", "public/theme_earnings.json", "public/daily_flash.json",
              "public/technical.json", "public/signal_evaluation.json", "public/market_history.json",
          ]
          for path in required:
              assert Path(path).exists(), path
          risk = json.load(open("public/risk_score.json", encoding="utf-8"))
          valuation = json.load(open("public/valuation.json", encoding="utf-8"))
          matrix = json.load(open("public/decision_matrix.json", encoding="utf-8"))
          matrix_evaluation = json.load(open("public/matrix_evaluation.json", encoding="utf-8"))
          daily_flash = json.load(open("public/daily_flash.json", encoding="utf-8"))
          global_markets = json.load(open("public/global_markets.json", encoding="utf-8"))
          market_extras = json.load(open("public/market_extras.json", encoding="utf-8"))
          catalysts = json.load(open("public/catalysts.json", encoding="utf-8"))
          macro = json.load(open("public/macro_calendar.json", encoding="utf-8"))
          theme = json.load(open("public/theme_earnings.json", encoding="utf-8"))
          assert risk.get("version") == 1
          assert valuation.get("version") == 1
          assert matrix.get("version") == 1
          assert matrix_evaluation.get("version") == 1
          assert daily_flash.get("version") == 1
          assert global_markets.get("version") == 1
          assert market_extras.get("version") == 1
          assert catalysts.get("version") == 1
          assert macro.get("version") == 1
          assert theme.get("version") == 1
          assert risk.get("label") in {"low", "balanced", "elevated", "high", "insufficient"}
          homepage = Path("public/index.html").read_text(encoding="utf-8")
          assert 'daily-flash-extras.js' in homepage
          assert 'daily-flash-intelligence.js' in homepage
          if matrix.get("generated_at"):
              assert matrix.get("summary", {}).get("total") == len(matrix.get("assets", {}))
              assert set(matrix.get("ranking", [])) == set(matrix.get("assets", {}))
          print("public artifacts validated")
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v5
