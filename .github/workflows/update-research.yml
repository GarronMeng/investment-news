name: Update Research Engine

on:
  workflow_dispatch:
  schedule:
    # Asia/Shanghai: 08:30 premarket and 15:35 after close, weekdays.
    - cron: "30 0 * * 1-5"
    - cron: "35 7 * * 1-5"
  workflow_run:
    workflows: ["Update A-share News", "Update Watchlist Market Quotes", "Update Market Sentiment"]
    branches: [main]
    types: [completed]
  push:
    branches: [main]
    paths:
      - watchlist.json
      - ai-signals.js
      - sentiment.json
      - market_state.json
      - scripts/fetch_history.py
      - scripts/build_features.py
      - scripts/build_technical.py
      - scripts/fetch_valuation.py
      - scripts/build_risk_score.py
      - scripts/build_decisions.py
      - scripts/build_decision_matrix.py
      - scripts/refine_decision_matrix.py
      - scripts/update_signal_ledger.py
      - scripts/evaluate_signals.py
      - scripts/update_matrix_ledger.py
      - scripts/evaluate_matrix_states.py
      - tests/test_research_engine.py
      - tests/test_technical.py
      - tests/test_valuation.py
      - tests/test_risk_score.py
      - tests/test_decision_matrix.py
      - tests/test_matrix_refinement.py
      - tests/test_matrix_evaluation.py
      - .github/workflows/update-research.yml

permissions:
  contents: write

concurrency:
  group: investment-research-update
  cancel-in-progress: true

jobs:
  update:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-sentiment.txt

      - name: Install China market provider
        run: python -m pip install "akshare>=1.18,<2"

      - name: Test research contracts
        run: |
          python -m unittest tests/test_research_engine.py -v
          python -m unittest tests/test_technical.py -v
          python -m unittest tests/test_valuation.py -v
          python -m unittest tests/test_risk_score.py -v
          python -m unittest tests/test_decision_matrix.py -v
          python -m unittest tests/test_matrix_refinement.py -v
          python -m unittest tests/test_matrix_evaluation.py -v

      - name: Refresh daily history
        run: python scripts/fetch_history.py

      - name: Build deterministic features
        run: python scripts/build_features.py

      - name: Build technical condition matrix
        run: python scripts/build_technical.py

      - name: Refresh index valuation history
        run: python scripts/fetch_valuation.py

      - name: Build market risk temperature
        run: python scripts/build_risk_score.py

      - name: Build research decisions
        run: python scripts/build_decisions.py

      - name: Preserve previous decision matrix
        run: cp decision_matrix.json /tmp/decision_matrix.prev.json 2>/dev/null || true

      - name: Build unified decision matrix
        run: python scripts/build_decision_matrix.py

      - name: Refine evidence conflict semantics
        run: python scripts/refine_decision_matrix.py --previous /tmp/decision_matrix.prev.json

      - name: Update append-only signal ledger
        run: python scripts/update_signal_ledger.py

      - name: Evaluate forward outcomes
        run: python scripts/evaluate_signals.py

      - name: Update append-only matrix state ledger
        run: python scripts/update_matrix_ledger.py

      - name: Evaluate matrix state outcomes
        run: python scripts/evaluate_matrix_states.py

      - name: Validate research outputs
        run: |
          python - <<'PY'
          import json

          watch = json.load(open("watchlist.json", encoding="utf-8"))
          history = json.load(open("market_history.json", encoding="utf-8"))
          features = json.load(open("features.json", encoding="utf-8"))
          technical = json.load(open("technical.json", encoding="utf-8"))
          valuation = json.load(open("valuation.json", encoding="utf-8"))
          risk = json.load(open("risk_score.json", encoding="utf-8"))
          decisions = json.load(open("decisions.json", encoding="utf-8"))
          matrix = json.load(open("decision_matrix.json", encoding="utf-8"))
          evaluation = json.load(open("signal_evaluation.json", encoding="utf-8"))
          matrix_evaluation = json.load(open("matrix_evaluation.json", encoding="utf-8"))

          expected = {str(item["code"]) for item in watch["assets"]}
          assert history.get("version") == 2
          assert features.get("version") == 2
          assert technical.get("version") == 1
          assert valuation.get("version") == 1
          assert risk.get("version") == 1
          assert matrix.get("version") == 1
          assert matrix_evaluation.get("version") == 1
          assert set(history.get("assets", {})) == expected
          assert set(features.get("assets", {})) == expected
          assert set(technical.get("assets", {})) == expected
          assert {str(item["asset"]) for item in decisions.get("decisions", [])} == expected
          assert set(matrix.get("assets", {})) == expected
          assert set(matrix.get("ranking", [])) == expected
          benchmark = history.get("benchmark", {})
          assert benchmark.get("status") == "fresh", f"benchmark stale: {benchmark.get('last_date')} {benchmark.get('error')}"
          assert len(benchmark.get("rows", [])) >= 120, "benchmark history too short"
          usable = sum(item.get("status") == "fresh" and len(item.get("rows", [])) >= 120 for item in history["assets"].values())
          assert usable >= max(1, len(expected) - 1), f"too few fresh histories: {usable}/{len(expected)}"
          lof = history["assets"].get("161226", {})
          assert lof.get("status") == "fresh" and len(lof.get("rows", [])) >= 120, f"LOF history unavailable: {lof.get('error')}"
          assert all(item.get("status") in {"active", "watch", "market_watch", "neutral"} for item in decisions["decisions"])
          forbidden = {"quantity", "position_size", "buy", "sell", "cost_basis", "stop_loss"}
          assert all(not forbidden.intersection(item) for item in decisions["decisions"]), "private/trade fields leaked into public decisions"
          assert all(not forbidden.intersection(item) for item in technical["assets"].values()), "trade fields leaked into technical matrix"
          assert all(not forbidden.intersection(item) for item in valuation.get("indices", {}).values()), "trade fields leaked into valuation"
          assert all(not forbidden.intersection(item) for item in matrix.get("assets", {}).values()), "private/trade fields leaked into decision matrix"
          assert risk.get("label") in {"low", "balanced", "elevated", "high", "insufficient"}
          assert 0 <= float(risk.get("coverage", 0)) <= 100
          if risk.get("score") is not None:
              assert 0 <= float(risk["score"]) <= 100
          for item in matrix["assets"].values():
              assert item.get("matrix_direction") in {"bullish", "bearish", "neutral", "insufficient"}
              assert 0 <= float(item.get("coverage", 0)) <= 100
              assert 0 <= float(item.get("confluence", 0)) <= 100
              assert 0 <= float(item.get("attention_score", 0)) <= 100
              assert 0 <= float(item.get("conflict_score", 0)) <= 100
          assert evaluation.get("version") == 1
          assert isinstance(matrix_evaluation.get("records", 0), int)
          print("validated research engine", usable, "/", len(expected), "fresh histories")
          print("valuation", valuation.get("summary"))
          print("risk", risk.get("score"), risk.get("label"), "coverage", risk.get("coverage"))
          print("decision matrix", matrix.get("summary"))
          print("matrix evaluation records", matrix_evaluation.get("records"))
          print("technical changes", len(technical.get("state_changes", [])))
          PY

      - name: Commit generated research data
        run: |
          git config user.name "investment-news-bot"
          git config user.email "investment-news-bot@users.noreply.github.com"
          git add market_history.json features.json technical.json valuation.json risk_score.json decisions.json decision_matrix.json signal_evaluation.json matrix_evaluation.json
          if [ -d signals ]; then git add signals/*.jsonl 2>/dev/null || true; fi
          if [ -d matrix_states ]; then git add matrix_states/*.jsonl 2>/dev/null || true; fi
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh research engine"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push; then
              exit 0
            fi
            git rebase --abort || true
            echo "Push retry ${attempt}/3"
            sleep $((attempt * 5))
          done
          echo "::error::Unable to push refreshed research data after 3 attempts"
          exit 1
