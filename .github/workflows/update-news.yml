name: Update A-share News

on:
  workflow_dispatch:
  schedule:
    # GitHub cron uses UTC. Four daily checkpoints in Asia/Shanghai:
    # 07:35 premarket backup, 08:20 primary premarket, 11:50 midday, 15:20 close.
    - cron: "35 23 * * *"
    - cron: "20 0 * * *"
    - cron: "50 3 * * *"
    - cron: "20 7 * * *"
  push:
    branches: [main]
    paths:
      - sources.json
      - watchlist.json
      - scripts/**
      - .github/workflows/update-news.yml

permissions:
  contents: write

concurrency:
  group: investment-news-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test news fetch rules
        run: python -m unittest discover -s tests -p 'test_fetch.py' -v

      - name: Fetch public news with retry
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "Fetch attempt ${attempt}/3"
            if python scripts/fetch.py; then
              break
            fi
            if [ "${attempt}" -eq 3 ]; then
              echo "::error::News fetch failed after 3 attempts"
              exit 1
            fi
            sleep $((attempt * 10))
          done

      - name: Validate freshness and output
        run: |
          test -s data.js
          grep -q "window.DATA" data.js
          python - <<'PY'
          import json
          from datetime import datetime, timezone

          text = open("data.js", encoding="utf-8").read()
          data = json.loads(text[text.index("{"):text.rindex("}") + 1])

          assert data.get("industries"), "industries is empty"
          assert data.get("generated_at"), "generated_at is missing"
          assert data.get("stats", {}).get("event_cards", 0) > 0, "event cards are empty"
          assert all(
              "trajectory" in item and "resonance" in item
              for industry in data["industries"]
              for item in industry.get("items", [])
          ), "trajectory or resonance fields are missing"

          history = json.load(open("history.json", encoding="utf-8"))
          assert history.get("topics"), "history topics are empty"

          stats = data.get("stats", {})
          unique_items = int(stats.get("unique_items", 0))
          assert unique_items >= 50, f"too few unique items: {unique_items}"

          timestamps = [
              item.get("ts", 0)
              for industry in data["industries"]
              for item in industry.get("items", [])
              if item.get("ts", 0)
          ]
          assert timestamps, "no timestamped news items"
          latest_age_hours = (datetime.now(timezone.utc).timestamp() - max(timestamps)) / 3600
          assert latest_age_hours <= 36, f"latest news is stale: {latest_age_hours:.1f} hours old"

          print(
              "validated",
              data["generated_at"],
              f"{unique_items} unique items",
              f"latest age {latest_age_hours:.1f}h",
              f"{stats.get('failed_sources', 0)} failed sources",
          )
          PY

      - name: Commit generated data
        run: |
          git config user.name "investment-news-bot"
          git config user.email "investment-news-bot@users.noreply.github.com"
          git add data.js history.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh A-share news"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push; then
              exit 0
            fi
            git rebase --abort || true
            echo "Push retry ${attempt}/3"
            sleep $((attempt * 5))
          done
          echo "::error::Unable to push refreshed news after 3 attempts"
          exit 1
