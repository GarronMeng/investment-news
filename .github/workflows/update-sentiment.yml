name: Update Market Sentiment

on:
  workflow_dispatch:
  schedule:
    # 08:10 Asia/Shanghai on weekdays: overnight VIX + previous A-share margin.
    - cron: "10 0 * * 1-5"
  push:
    branches: [main]
    paths:
      - requirements-sentiment.txt
      - scripts/fetch_sentiment.py
      - tests/test_sentiment.py
      - .github/workflows/update-sentiment.yml

permissions:
  contents: write

concurrency:
  group: investment-sentiment-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-sentiment.txt

      - name: Install data providers
        run: python -m pip install -r requirements-sentiment.txt

      - name: Test sentiment rules
        run: python -m unittest tests/test_sentiment.py -v

      - name: Refresh sentiment data
        run: python scripts/fetch_sentiment.py

      - name: Validate data contract
        run: |
          python - <<'PY'
          import json

          data = json.load(open("sentiment.json", encoding="utf-8"))
          assert data.get("version") == 1
          assert data.get("generated_at")
          assert set(data.get("states", {})) == {"overseas_risk", "leverage_sentiment"}
          metrics = {item["id"]: item for item in data.get("metrics", [])}
          assert set(metrics) == {"vix", "margin_balance"}
          assert all(item.get("status") in {"fresh", "stale", "unavailable"} for item in metrics.values())
          assert all("as_of" in item and "confidence" in item for item in metrics.values())
          print("validated", data["generated_at"], [(key, value["status"]) for key, value in metrics.items()])
          PY

      - name: Commit generated sentiment
        run: |
          git config user.name "investment-news-bot"
          git config user.email "investment-news-bot@users.noreply.github.com"
          git add sentiment.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh market sentiment"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push; then
              exit 0
            fi
            git rebase --abort || true
            echo "Push retry ${attempt}/3"
          done
          echo "::error::Unable to push refreshed sentiment after 3 attempts"
          exit 1
