<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Garron A股信号台</title>
<style>
:root{--bg:#080b11;--panel:#111722;--panel2:#0d121b;--line:#232c3a;--text:#edf2f7;--muted:#8e9bad;--up:#ef6b73;--down:#4fc09a;--warn:#e4b44f;--accent:#66a3ff;--accent-soft:#16243a}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.shell{max-width:1540px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:18px}.title h1{font-size:30px;letter-spacing:-.03em;margin:0 0 4px}.title p{margin:0;color:var(--muted)}.actions,.quick-nav{display:flex;gap:9px;flex-wrap:wrap}.btn,.nav-link{border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--text);padding:9px 12px;text-decoration:none}.btn:hover,.nav-link:hover{border-color:#496991}.quick-nav{margin-bottom:16px}.nav-link{padding:7px 11px;color:#b9c5d4;background:var(--panel2)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}.stat,.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px}.stat{padding:14px 16px;min-width:0}.stat b{display:block;font-size:21px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.stat span{color:var(--muted);font-size:12px}.panel{padding:18px;margin-bottom:14px;scroll-margin-top:14px}.section-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:14px}.section-title h2{font-size:18px;margin:0 0 2px}.section-title p{color:var(--muted);font-size:12px;margin:0}.section-count{color:var(--accent);background:var(--accent-soft);border:1px solid #2a4a72;border-radius:999px;padding:4px 9px;font-size:12px;white-space:nowrap}
.signals-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.signal{padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--panel2);min-width:0}.signal-head{display:flex;align-items:flex-start;gap:10px}.event{font-size:15px;font-weight:680;line-height:1.45;flex:1}.badge{font-size:11px;padding:3px 8px;border-radius:999px;white-space:nowrap;border:1px solid}.positive{color:var(--up);border-color:#74383e;background:#2b171b}.negative{color:var(--down);border-color:#275f50;background:#10261f}.mixed,.neutral{color:var(--warn);border-color:#715b2e;background:#2b2415}.meta{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.chip{background:#18202c;color:#b7c2d0;border-radius:6px;padding:2px 7px;font-size:12px}.reason{color:#cad2dd}.signal-more,.asset-more{margin-top:11px;border-top:1px solid var(--line);padding-top:9px}.signal-more summary,.asset-more summary{cursor:pointer;color:#9fbcdf;font-size:12px;list-style:none}.signal-more summary::-webkit-details-marker,.asset-more summary::-webkit-details-marker{display:none}.signal-more summary::after,.asset-more summary::after{content:" ＋"}.signal-more[open] summary::after,.asset-more[open] summary::after{content:" －"}.conditions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.condition{border-left:2px solid var(--accent);padding-left:9px;color:var(--muted);font-size:12px}.condition.bad{border-color:var(--warn)}.links{margin-top:9px}.links a{color:#8cb8ff;margin-right:8px;text-decoration:none;font-size:12px}.notice{font-size:12px;color:var(--muted);margin-top:12px}
.watch{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.asset{padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--panel2);min-width:0}.asset-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.asset-name{font-size:16px;font-weight:680}.asset-code,.small{font-size:12px;color:var(--muted)}.asset-thesis{color:#c5cfda;margin-top:8px}.asset-status{display:flex;align-items:center;gap:7px;flex-shrink:0}.priority{font-size:11px;color:var(--warn);border:1px solid #66552f;border-radius:999px;padding:2px 7px}.hits{font-size:12px;color:var(--accent);white-space:nowrap}.trigger-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:9px}.trigger{font-size:12px;color:var(--muted)}.trigger b{color:#bfc9d5}.trigger ul{margin:5px 0 0;padding-left:17px}
.tabs-bar{display:flex;align-items:center;gap:10px;margin-bottom:11px}.tabs{display:flex;gap:7px;overflow:auto;flex:1;scrollbar-width:thin}.tab{border:1px solid var(--line);background:var(--panel2);color:var(--muted);padding:7px 10px;border-radius:8px;cursor:pointer;white-space:nowrap}.tab.active{color:#fff;border-color:#4e78b8;background:var(--accent-soft)}.news{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:22px}.news-row{display:grid;grid-template-columns:1fr auto;gap:12px;padding:11px 0;border-top:1px solid var(--line);min-width:0}.news-row:nth-child(-n+2){border-top:0}.news a{color:var(--text);text-decoration:none}.news a:hover{color:#8cb8ff}.source{font-size:11px;color:var(--muted);margin-top:3px}.more-btn{display:none;width:100%;margin-top:10px;border:1px solid var(--line);background:var(--panel2);color:#b9c5d4;padding:9px;border-radius:9px;cursor:pointer}.more-btn:hover{border-color:#496991}.empty{color:var(--muted);padding:12px 0}.boundary{display:flex;gap:12px;align-items:flex-start;color:var(--muted);font-size:12px}.boundary b{color:#c7d1dc;white-space:nowrap}
@media(max-width:1100px){.signals-grid,.watch{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:760px){.shell{padding:14px}.top{display:block}.actions{margin-top:12px}.stats{grid-template-columns:repeat(2,1fr)}.signals-grid,.watch,.news{grid-template-columns:1fr}.news-row:nth-child(2){border-top:1px solid var(--line)}.conditions,.trigger-grid{grid-template-columns:1fr}.panel{padding:15px}.quick-nav{overflow:auto;flex-wrap:nowrap}.nav-link{white-space:nowrap}.title h1{font-size:25px}}@media(max-width:420px){.stat b{font-size:18px}.section-head{display:block}.section-count{display:inline-block;margin-top:7px}}
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="title"><h1>Garron A股信号台</h1><p>先看判断，再看自选，最后核对新闻证据</p></div>
    <div class="actions"><a class="btn" href="https://github.com/GarronMeng/investment-news/actions/workflows/update-news.yml" target="_blank" rel="noopener">手动更新</a><a class="btn" href="https://github.com/GarronMeng/investment-news" target="_blank" rel="noopener">GitHub</a></div>
  </header>
  <nav class="quick-nav" aria-label="页面导航"><a class="nav-link" href="#signals-panel">① 今日判断</a><a class="nav-link" href="#watch-panel">② 自选雷达</a><a class="nav-link" href="#news-panel">③ 新闻证据</a></nav>
  <section class="stats" id="stats"></section>

  <section class="panel" id="signals-panel">
    <div class="section-head"><div class="section-title"><h2>今日关键信号</h2><p>事件与一句判断优先展示；验证条件和证据按需展开</p></div><span class="section-count" id="signal-count">0 条</span></div>
    <div class="signals-grid" id="signals"></div><div class="notice" id="ai-status">AI 信号由 ChatGPT 网页版独立生成。强度只衡量产业事件的潜在影响；仍需结合价格、成交量和板块联动验证。</div>
  </section>

  <section class="panel" id="watch-panel">
    <div class="section-head"><div class="section-title"><h2>自选标的雷达</h2><p>核心逻辑完整展示；催化、风险和盘面确认条件收纳在卡片内</p></div><span class="section-count" id="watch-count">0 个</span></div>
    <div class="watch" id="watch"></div>
  </section>

  <section class="panel" id="news-panel">
    <div class="section-head"><div class="section-title"><h2>行业新闻证据</h2><p>默认每次显示 8 条，切换行业可快速缩小阅读范围</p></div><span class="section-count" id="news-count">0 条</span></div>
    <div class="tabs-bar"><div class="tabs" id="tabs"></div></div><div class="news" id="news"></div><button class="more-btn" id="more-news" type="button">继续加载 8 条</button>
  </section>

  <section class="panel boundary"><b>系统边界</b><span>本看板处理公开新闻及产业链映射，未接入实时行情、账户持仓和交易接口；新闻与 AI 判断均需经过盘面验证。</span></section>
</div>
<script>
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function safe(u){return /^https?:\/\//i.test(String(u||''))?esc(u):''}
function list(items){return (items||[]).map(x=>`<li>${esc(x)}</li>`).join('')}
function render(){
 const D=window.DATA||{};const A=window.AI_SIGNALS||{};const inds=D.industries||[];const signals=A.signals||[];const watch=D.watchlist||[];const st=D.stats||{};
 document.getElementById('stats').innerHTML=[['新闻更新',D.generated_at||'—'],['AI信号',signals.length],['去重新闻',st.unique_items||0],['AI更新',A.generated_at||'待运行']].map(x=>`<div class="stat"><b title="${esc(x[1])}">${esc(x[1])}</b><span>${esc(x[0])}</span></div>`).join('');
 document.getElementById('signal-count').textContent=signals.length+' 条';document.getElementById('watch-count').textContent=watch.length+' 个';
 document.getElementById('signals').innerHTML=signals.length?signals.map(s=>{
   const assets=(s.assets||[]).map(code=>{const a=watch.find(x=>x.code===code);return `<span class="chip">${esc(a?a.name:code)}</span>`}).join('');
   const refs=(s.urls||[]).map((u,j)=>safe(u)?`<a href="${safe(u)}" target="_blank" rel="noopener">证据${j+1} ↗</a>`:'').join('');
   return `<article class="signal"><div class="signal-head"><div class="event">${esc(s.event)}</div><span class="badge ${esc(s.direction)}">${esc(s.direction)} · ${esc(s.strength)}/5</span></div><div class="meta"><span class="chip">${esc(s.industry_name)}</span><span class="chip">${esc(s.horizon)}</span><span class="chip">已交易 ${esc(s.priced_in)}</span>${assets}</div><div class="reason">${esc(s.reason)}</div><details class="signal-more"><summary>展开验证、失效与证据</summary><div class="conditions"><div class="condition"><b>验证</b><br>${(s.validation||['待价格与成交量确认']).map(esc).join('<br>')}</div><div class="condition bad"><b>失效</b><br>${(s.invalidation||['暂无明确失效条件']).map(esc).join('<br>')}</div></div><div class="links">${refs}</div></details></article>`
 }).join(''):'<div class="empty">ChatGPT 网页版尚未生成有效信号；原始新闻与自选雷达仍会正常更新。</div>';
 document.getElementById('watch').innerHTML=watch.map(a=>`<article class="asset"><div class="asset-top"><div><div class="asset-name">${esc(a.name)}</div><div class="asset-code">${esc(a.code)}</div></div><div class="asset-status"><span class="priority">P${esc(a.priority||'—')}</span><span class="hits">${esc(a.news_hits||0)} 命中</span></div></div><div class="asset-thesis">${esc(a.thesis||'暂无核心逻辑')}</div><details class="asset-more"><summary>展开催化、风险与确认条件</summary><div class="trigger-grid"><div class="trigger"><b>正向催化</b><ul>${list(a.positive_triggers)}</ul></div><div class="trigger"><b>主要风险</b><ul>${list(a.negative_triggers)}</ul></div><div class="trigger"><b>盘面确认</b><ul>${list(a.market_validation)}</ul></div></div></details></article>`).join('');
 const status=document.getElementById('ai-status');if(A.source_generated_at&&D.generated_at&&A.source_generated_at!==D.generated_at){status.textContent='AI 信号基于 '+A.source_generated_at+' 的新闻，当前新闻已更新至 '+D.generated_at+'；等待 ChatGPT 网页版下一次研判。'}
 const tabs=document.getElementById('tabs'),news=document.getElementById('news'),more=document.getElementById('more-news');let active=null,visible=8;
 function show(ind,reset=true){if(!ind)return;active=ind;if(reset)visible=8;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.key===ind.key));const items=ind.items||[];document.getElementById('news-count').textContent=items.length+' 条';news.innerHTML=items.slice(0,visible).map(it=>`<div class="news-row"><div><a href="${safe(it.url)}" target="_blank" rel="noopener">${esc(it.zh||it.title)}</a><div class="source">${esc(it.source)} · ${esc(it.time)}</div></div></div>`).join('')||'<div class="empty">暂无新闻</div>';more.style.display=items.length>visible?'block':'none'}
 tabs.innerHTML=inds.map((ind,i)=>`<button class="tab ${i?'':'active'}" data-key="${esc(ind.key)}">${esc(ind.name)} · ${esc(ind.total||0)}</button>`).join('');tabs.querySelectorAll('.tab').forEach(btn=>btn.onclick=()=>show(inds.find(x=>x.key===btn.dataset.key)));more.onclick=()=>{visible+=8;show(active,false)};if(inds[0])show(inds[0]);
}
function loadSignals(){const a=document.createElement('script');a.src='ai-signals.js?t='+Date.now();a.onload=render;a.onerror=render;document.head.appendChild(a)}
const s=document.createElement('script');s.src='data.js?t='+Date.now();s.onload=loadSignals;s.onerror=()=>document.body.innerHTML='<div class="shell"><div class="empty">data.js 加载失败</div></div>';document.head.appendChild(s);
</script>
</body>
</html>
