<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Garron A股信号台</title>
<style>
:root{--bg:#080b11;--panel:#111722;--line:#232c3a;--text:#edf2f7;--muted:#8e9bad;--up:#ef6b73;--down:#4fc09a;--warn:#e4b44f;--accent:#66a3ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.shell{max-width:1440px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:18px}.title h1{font-size:28px;margin:0 0 4px}.title p{margin:0;color:var(--muted)}.actions{display:flex;gap:9px}.btn{border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--text);padding:9px 12px;text-decoration:none}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}.stat,.panel{background:var(--panel);border:1px solid var(--line);border-radius:13px}.stat{padding:14px}.stat b{display:block;font-size:23px}.stat span{color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:1.5fr .85fr;gap:14px}.panel{padding:16px;margin-bottom:14px}.panel h2{font-size:16px;margin:0 0 12px}.signal{padding:14px 0;border-top:1px solid var(--line)}.signal:first-of-type{border-top:0;padding-top:0}.signal-head{display:flex;align-items:flex-start;gap:10px}.event{font-size:16px;font-weight:650;flex:1}.badge{font-size:11px;padding:3px 8px;border-radius:999px;white-space:nowrap;border:1px solid}.positive{color:var(--up);border-color:#74383e;background:#2b171b}.negative{color:var(--down);border-color:#275f50;background:#10261f}.mixed,.neutral{color:var(--warn);border-color:#715b2e;background:#2b2415}.meta{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0}.chip{background:#18202c;color:#b7c2d0;border-radius:6px;padding:2px 7px;font-size:12px}.reason{color:#cad2dd}.conditions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.condition{border-left:2px solid var(--accent);padding-left:9px;color:var(--muted);font-size:12px}.condition.bad{border-color:var(--warn)}.links a{color:#8cb8ff;margin-right:8px;text-decoration:none}.watch{display:grid;gap:8px}.asset{padding:11px;border:1px solid var(--line);border-radius:10px;background:#0d121b}.asset-top{display:flex;justify-content:space-between}.asset-name{font-weight:650}.asset-code,.small{font-size:12px;color:var(--muted)}.hits{color:var(--accent)}.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:11px}.tab{border:1px solid var(--line);background:#0d121b;color:var(--muted);padding:7px 10px;border-radius:8px;cursor:pointer;white-space:nowrap}.tab.active{color:#fff;border-color:#4e78b8;background:#16243a}.news{display:grid;gap:7px}.news-row{display:grid;grid-template-columns:1fr auto;gap:12px;padding:10px 0;border-top:1px solid var(--line)}.news-row:first-child{border-top:0}.news a{color:var(--text);text-decoration:none}.news a:hover{color:#8cb8ff}.source{font-size:11px;color:var(--muted)}.empty{color:var(--muted);padding:12px 0}.notice{font-size:12px;color:var(--muted);margin-top:10px}@media(max-width:900px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.conditions{grid-template-columns:1fr}.top{display:block}.actions{margin-top:12px}.shell{padding:14px}}@media(max-width:520px){.stats{grid-template-columns:1fr 1fr}.stat b{font-size:19px}.title h1{font-size:23px}}
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="title"><h1>Garron A股信号台</h1><p>产业事件 → A股映射 → 市场验证 → 失效条件</p></div>
    <div class="actions"><a class="btn" href="https://github.com/GarronMeng/investment-news/actions/workflows/update-news.yml" target="_blank" rel="noopener">手动更新</a><a class="btn" href="https://github.com/GarronMeng/investment-news" target="_blank" rel="noopener">GitHub</a></div>
  </header>
  <section class="stats" id="stats"></section>
  <div class="grid">
    <main>
      <section class="panel"><h2>今日关键信号</h2><div id="signals"></div><div class="notice">强度衡量事件对关注产业链的潜在影响。缺少实时行情时，“是否已交易”默认标记为未知，必须结合价格、成交量和板块联动验证。</div></section>
      <section class="panel"><h2>行业新闻证据</h2><div class="tabs" id="tabs"></div><div class="news" id="news"></div></section>
    </main>
    <aside>
      <section class="panel"><h2>自选标的雷达</h2><div class="watch" id="watch"></div></section>
      <section class="panel"><h2>系统边界</h2><div class="small">该看板只处理公开新闻及产业链映射。目前未接入实时行情、账户持仓和交易接口，因此不会自动下单，也不会将新闻直接等同于交易信号。</div></section>
    </aside>
  </div>
</div>
<script>
function esc(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function safe(u){return /^https?:\/\//i.test(String(u||''))?esc(u):''}
function render(){
 const D=window.DATA||{};const inds=D.industries||[];const signals=D.signals||[];const watch=D.watchlist||[];const st=D.stats||{};
 document.getElementById('stats').innerHTML=[['更新时间',D.generated_at||'—'],['关键信号',signals.length],['去重新闻',st.unique_items||0],['失败来源',st.failed_sources||0]].map(x=>`<div class="stat"><b>${esc(x[1])}</b><span>${esc(x[0])}</span></div>`).join('');
 document.getElementById('signals').innerHTML=signals.length?signals.map((s,i)=>{
   const assets=(s.assets||[]).map(code=>{const a=watch.find(x=>x.code===code);return `<span class="chip">${esc(a?a.name:code)}</span>`}).join('');
   const refs=(s.urls||[]).map((u,j)=>safe(u)?`<a href="${safe(u)}" target="_blank" rel="noopener">证据${j+1} ↗</a>`:'').join('');
   return `<article class="signal"><div class="signal-head"><div class="event">${esc(s.event)}</div><span class="badge ${esc(s.direction)}">${esc(s.direction)} · ${esc(s.strength)}/5</span></div><div class="meta"><span class="chip">${esc(s.industry_name)}</span><span class="chip">周期 ${esc(s.horizon)}</span><span class="chip">已交易 ${esc(s.priced_in)}</span>${assets}</div><div class="reason">${esc(s.reason)}</div><div class="conditions"><div class="condition"><b>验证</b><br>${(s.validation||['待价格与成交量确认']).map(esc).join('<br>')}</div><div class="condition bad"><b>失效</b><br>${(s.invalidation||['暂无明确失效条件']).map(esc).join('<br>')}</div></div><div class="links">${refs}</div></article>`
 }).join(''):'<div class="empty">暂无AI信号。请配置仓库 Secret：LLM_API_KEY 后运行工作流；原始新闻仍可正常更新。</div>';
 document.getElementById('watch').innerHTML=watch.map(a=>`<div class="asset"><div class="asset-top"><div><span class="asset-name">${esc(a.name)}</span> <span class="asset-code">${esc(a.code)}</span></div><span class="hits">${esc(a.news_hits||0)} 命中</span></div><div class="small">${esc(a.thesis||'')}</div></div>`).join('');
 const tabs=document.getElementById('tabs'),news=document.getElementById('news');
 function show(ind){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.key===ind.key));news.innerHTML=(ind.items||[]).slice(0,24).map(it=>`<div class="news-row"><div><a href="${safe(it.url)}" target="_blank" rel="noopener">${esc(it.zh||it.title)}</a><div class="source">${esc(it.source)} · ${esc(it.time)}</div></div></div>`).join('')||'<div class="empty">暂无新闻</div>'}
 tabs.innerHTML=inds.map((ind,i)=>`<button class="tab ${i?'':'active'}" data-key="${esc(ind.key)}">${esc(ind.name)}</button>`).join('');tabs.querySelectorAll('.tab').forEach(btn=>btn.onclick=()=>show(inds.find(x=>x.key===btn.dataset.key)));if(inds[0])show(inds[0]);
}
const s=document.createElement('script');s.src='data.js?t='+Date.now();s.onload=render;s.onerror=()=>document.body.innerHTML='<div class="shell"><div class="empty">data.js 加载失败</div></div>';document.head.appendChild(s);
</script>
</body>
</html>
