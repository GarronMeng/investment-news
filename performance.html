<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark light"><title>Garron 信号战绩</title><style>
:root{color-scheme:dark;--bg:#070b12;--panel:#0e1520;--panel2:#111b28;--line:#223047;--text:#edf4fb;--muted:#8d9cb0;--up:#ff6675;--down:#45c7c4;--warn:#f2b45f;--accent:#69a6ff}:root[data-theme=light]{color-scheme:light;--bg:#f4f6f9;--panel:#fff;--panel2:#f8fafc;--line:#dce4ee;--text:#172033;--muted:#667085;--up:#c53f4d;--down:#138680;--warn:#9b6706;--accent:#2468c9}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.shell{max-width:1280px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px}.top h1{margin:0;font-size:24px}.btn,select{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:8px;padding:8px 10px;text-decoration:none}.panel{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:14px;margin-bottom:12px}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.stat,.card{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:10px}.stat b{display:block;font-size:19px}.stat span,.muted{font-size:11px;color:var(--muted)}.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.table{overflow:auto}table{width:100%;border-collapse:collapse;min-width:880px}th,td{padding:9px 8px;border-top:1px solid var(--line);text-align:right;white-space:nowrap}th{color:var(--muted);font-size:11px}th:first-child,td:first-child{text-align:left}.up{color:var(--up)}.down{color:var(--down)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.card h3{margin:0 0 4px;font-size:15px}.metric-row{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}.metric{border-left:2px solid var(--line);padding-left:7px}.metric b{display:block}.metric span{font-size:10px;color:var(--muted)}.foot{font-size:11px;color:var(--muted)}@media(max-width:900px){.stats{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.shell{padding:10px}.top{display:block}.top .btn{display:inline-block;margin-top:8px}.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}
</style><script>(()=>{try{document.documentElement.dataset.theme=localStorage.getItem('garron-workbench-theme')||((matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark')}catch(e){}})()</script></head><body><div class="shell"><div class="top"><div><h1>信号战绩深度页</h1><div class="muted">把研究判断当作可结算样本；T+1 / T+5 / T+20 分开看，不把短周期命中率外推成长期能力。</div></div><a class="btn" href="index.html">返回工作台</a></div><section class="panel"><div class="stats" id="summary"></div></section><section class="panel"><div class="filters"><b>拆解</b><select id="horizon"><option value="t1">T+1</option><option value="t5">T+5</option><option value="t20">T+20</option></select><select id="bias"><option value="all">全部方向</option><option value="bullish">bullish</option><option value="bearish">bearish</option><option value="neutral">neutral</option></select><span class="muted" id="stamp"></span></div></section><section class="panel"><h2 style="font-size:17px;margin-top:0">按标的</h2><div class="grid" id="assets"></div></section><section class="panel"><h2 style="font-size:17px;margin-top:0">已结算样本</h2><div class="table"><table><thead><tr><th>标的 / 日期</th><th>方向</th><th>状态</th><th>资产收益</th><th>基准收益</th><th>超额</th><th>正确</th><th>MFE20</th><th>MAE20</th></tr></thead><tbody id="rows"></tbody></table></div></section><div class="foot">正确率的定义沿用 `signal_evaluation.json` 的前向结算逻辑。样本量、市场环境与信号类型会显著影响结果；页面不把历史胜率转成未来概率，也不根据胜率自动调仓。</div></div><script>
const $=id=>document.getElementById(id),pct=v=>Number.isFinite(Number(v))?`${Number(v)>0?'+':''}${(Number(v)*100).toFixed(2)}%`:'—',ratio=v=>Number.isFinite(Number(v))?`${(Number(v)*100).toFixed(1)}%`:'—',avg=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:null;let E={};function filtered(){const h=$('horizon').value,b=$('bias').value;return(E.evaluations||[]).filter(x=>(b==='all'||x.bias===b)&&x.horizons?.[h]?.status==='settled')}function renderSummary(){const s=E.summary||{},cards=[];for(const h of['t1','t5','t20']){const x=s[h]||{};cards.push([h.toUpperCase()+' 样本',x.settled??0],[h.toUpperCase()+' 胜率',x.win_rate==null?'积累中':ratio(x.win_rate)])}$('summary').innerHTML=cards.map(x=>`<div class="stat"><b>${x[1]}</b><span>${x[0]}</span></div>`).join('')}function render(){const h=$('horizon').value,rows=filtered(),groups={};rows.forEach(x=>(groups[x.asset]||(groups[x.asset]=[])).push(x));$('stamp').textContent=`${E.generated_at||'—'} · ${h.toUpperCase()} 已结算 ${rows.length}`;$('assets').innerHTML=Object.values(groups).sort((a,b)=>b.length-a.length).map(g=>{const hs=g.map(x=>x.horizons[h]),wins=hs.filter(x=>x.correct).length,ex=hs.map(x=>Number(x.excess_return)).filter(Number.isFinite),mfe=g.map(x=>Number(x.mfe_20d)).filter(Number.isFinite),mae=g.map(x=>Number(x.mae_20d)).filter(Number.isFinite);return`<div class="card"><h3>${g[0].name} <span class="muted">${g[0].asset}</span></h3><div class="muted">${g.length} 个已结算样本</div><div class="metric-row"><div class="metric"><b>${ratio(wins/g.length)}</b><span>胜率</span></div><div class="metric"><b>${pct(avg(ex))}</b><span>平均超额</span></div><div class="metric"><b>${pct(avg(mfe))} / ${pct(avg(mae))}</b><span>MFE / MAE</span></div></div></div>`}).join('')||'<div class="muted">该筛选下暂无已结算样本</div>';$('rows').innerHTML=rows.sort((a,b)=>String(b.signal_date).localeCompare(String(a.signal_date))).map(x=>{const z=x.horizons[h]||{};return`<tr><td><b>${x.name}</b><div class="muted">${x.signal_date}</div></td><td>${x.bias}</td><td>${x.research_status}</td><td class="${Number(z.asset_return)>=0?'up':'down'}">${pct(z.asset_return)}</td><td>${pct(z.benchmark_return)}</td><td class="${Number(z.excess_return)>=0?'up':'down'}">${pct(z.excess_return)}</td><td>${z.correct?'✓':'×'}</td><td class="up">${pct(x.mfe_20d)}</td><td class="down">${pct(x.mae_20d)}</td></tr>`}).join('')||'<tr><td colspan="9" class="muted">暂无样本</td></tr>'}Promise.all([fetch('signal_evaluation.json',{cache:'no-store'}).then(r=>r.json())]).then(([e])=>{E=e;renderSummary();render()});$('horizon').onchange=render;$('bias').onchange=render;
</script></body></html>
