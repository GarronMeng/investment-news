<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Garron 多周期图表</title>
<style>
:root{color-scheme:dark;--bg:#070b12;--panel:#0f1723;--line:#26344a;--text:#edf4fb;--muted:#8d9cb0;--up:#ff6675;--down:#45c7c4;--accent:#69a6ff;--ma20:#f2b45f;--ma60:#aa83ff}:root[data-theme=light]{color-scheme:light;--bg:#f4f6f9;--panel:#fff;--line:#dce4ee;--text:#172033;--muted:#667085;--up:#c53f4d;--down:#138680;--accent:#2468c9;--ma20:#9b6706;--ma60:#7148ce}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.shell{max-width:1320px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:12px}.top h1{margin:0;font-size:24px}.muted{color:var(--muted)}.btn,select{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:8px 10px;border-radius:9px;text-decoration:none}.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.periods{display:flex;gap:6px}.periods button{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:8px;padding:7px 10px;cursor:pointer}.periods button.active{border-color:var(--accent);color:var(--text)}.panel{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:14px}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:12px}.stat{border:1px solid var(--line);border-radius:10px;padding:9px}.stat b{display:block;font-size:16px}.stat span{font-size:11px;color:var(--muted)}canvas{display:block;width:100%;height:auto;min-height:360px}.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:11px;margin-top:8px}.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:4px}.foot{margin-top:10px;color:var(--muted);font-size:11px}@media(max-width:760px){.top{display:block}.controls{margin-top:10px}.stats{grid-template-columns:repeat(3,1fr)}canvas{min-height:300px}}@media(max-width:440px){.shell{padding:10px}.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head><body><div class="shell">
<div class="top"><div><h1>多周期 K 线</h1><div class="muted">日线 OHLCV｜20 / 60 / 140 个交易日｜MA20 / MA60</div></div><div class="controls"><a class="btn" href="index.html">返回工作台</a><select id="asset"></select><div class="periods" id="periods"><button data-n="20">20D</button><button data-n="60" class="active">60D</button><button data-n="140">140D</button></div></div></div>
<div class="panel"><div class="stats" id="stats"></div><canvas id="chart" width="1200" height="620"></canvas><div class="legend"><span><i class="dot" style="background:var(--up)"></i>上涨</span><span><i class="dot" style="background:var(--down)"></i>下跌</span><span><i class="dot" style="background:var(--ma20)"></i>MA20</span><span><i class="dot" style="background:var(--ma60)"></i>MA60</span></div></div>
<div class="foot">图表读取公开 research history；当前历史引擎为日线、不复权研究数据。图表只描述价格结构，不生成交易指令。</div>
</div><script>
const $=id=>document.getElementById(id),num=(v,d=2)=>Number.isFinite(Number(v))?Number(v).toFixed(d):'—',pct=v=>Number.isFinite(Number(v))?`${Number(v)>0?'+':''}${Number(v).toFixed(2)}%`:'—';let H={},W={},period=60;
async function load(){[H,W]=await Promise.all([fetch('market_history.json',{cache:'no-store'}).then(r=>r.json()),fetch('watchlist.json',{cache:'no-store'}).then(r=>r.json())]);const sel=$('asset');const items=[H.benchmark,...Object.values(H.assets||{})];sel.innerHTML=items.map(x=>`<option value="${x.code}">${x.name} · ${x.code}</option>`).join('');sel.onchange=draw;document.querySelectorAll('#periods button').forEach(b=>b.onclick=()=>{period=Number(b.dataset.n);document.querySelectorAll('#periods button').forEach(x=>x.classList.toggle('active',x===b));draw()});addEventListener('resize',draw);draw()}
function series(){const code=$('asset').value;return String(H.benchmark?.code)===String(code)?H.benchmark:(H.assets||{})[code]||{rows:[]}}
function ma(rows,n){return rows.map((r,i)=>{if(i+1<n)return null;let s=0;for(let j=i-n+1;j<=i;j++)s+=Number(rows[j].close);return s/n})}
function css(name){return getComputedStyle(document.documentElement).getPropertyValue(name).trim()}
function draw(){const s=series(),all=s.rows||[],rows=all.slice(-period),c=$('chart'),box=c.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2),w=Math.max(640,Math.round(box.width*dpr)),h=Math.round((innerWidth<760?430:620)*dpr);if(c.width!==w||c.height!==h){c.width=w;c.height=h}const x=c.getContext('2d');x.clearRect(0,0,w,h);const pad={l:58*dpr,r:18*dpr,t:24*dpr,b:72*dpr},vh=115*dpr,ph=h-pad.t-pad.b-vh,gap=18*dpr;if(!rows.length){x.fillStyle=css('--muted');x.fillText('暂无数据',pad.l,pad.t+20);return}const highs=rows.map(r=>Number(r.high)),lows=rows.map(r=>Number(r.low)),pmax=Math.max(...highs),pmin=Math.min(...lows),span=Math.max(1e-9,pmax-pmin),volmax=Math.max(...rows.map(r=>Number(r.volume)||0),1),step=(w-pad.l-pad.r)/rows.length,body=Math.max(2*dpr,Math.min(10*dpr,step*.58));const py=v=>pad.t+(pmax-v)/span*ph;const vy=v=>pad.t+ph+gap+vh-(v/volmax)*vh; x.strokeStyle=css('--line');x.lineWidth=1*dpr;x.font=`${11*dpr}px system-ui`;x.fillStyle=css('--muted');for(let i=0;i<5;i++){const val=pmax-span*i/4,yy=py(val);x.beginPath();x.moveTo(pad.l,yy);x.lineTo(w-pad.r,yy);x.stroke();x.fillText(num(val,2),4*dpr,yy+4*dpr)}rows.forEach((r,i)=>{const cx=pad.l+step*(i+.5),o=Number(r.open),cl=Number(r.close),hi=Number(r.high),lo=Number(r.low),color=cl>=o?css('--up'):css('--down');x.strokeStyle=color;x.fillStyle=color;x.beginPath();x.moveTo(cx,py(hi));x.lineTo(cx,py(lo));x.stroke();const y1=py(Math.max(o,cl)),y2=py(Math.min(o,cl));x.fillRect(cx-body/2,y1,body,Math.max(1.5*dpr,y2-y1));const v=Number(r.volume)||0;x.globalAlpha=.45;x.fillRect(cx-body/2,vy(v),body,pad.t+ph+gap+vh-vy(v));x.globalAlpha=1});const fullMA20=ma(all,20).slice(-period),fullMA60=ma(all,60).slice(-period);function line(vals,color){x.strokeStyle=color;x.lineWidth=1.6*dpr;x.beginPath();let started=false;vals.forEach((v,i)=>{if(v==null)return;const cx=pad.l+step*(i+.5),yy=py(v);if(!started){x.moveTo(cx,yy);started=true}else x.lineTo(cx,yy)});x.stroke()}line(fullMA20,css('--ma20'));line(fullMA60,css('--ma60'));x.fillStyle=css('--muted');const every=Math.max(1,Math.ceil(rows.length/6));rows.forEach((r,i)=>{if(i%every)return;const cx=pad.l+step*(i+.5);x.fillText(String(r.date).slice(5),cx-14*dpr,h-18*dpr)});const last=rows.at(-1),prev=rows.length>1?rows.at(-2):null,chg=prev?Number(last.close)/Number(prev.close)*100-100:null;const m20=fullMA20.at(-1),m60=fullMA60.at(-1);$('stats').innerHTML=[['收盘',num(last.close,3)],['日涨跌',pct(chg)],['最高',num(last.high,3)],['最低',num(last.low,3)],['MA20',num(m20,3)],['MA60',num(m60,3)]].map(([a,b])=>`<div class="stat"><b>${b}</b><span>${a}</span></div>`).join('')}
load();
</script></body></html>
