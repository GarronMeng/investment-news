<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light dark">
<title>Daily Flash · Garron 投资驾驶舱</title>
<style>
:root{--navy:#10243f;--navy2:#18375e;--gold:#d7ad27;--bg:#f5f6f8;--paper:#fff;--soft:#f1f4f8;--line:#dde3eb;--text:#17243a;--muted:#6f7d90;--up:#d94d52;--down:#16946d;--warn:#b78412;--blue:#386b9e;--shadow:0 6px 22px rgba(16,36,63,.07)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.52 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.hero{background:linear-gradient(135deg,var(--navy),#0b1b31);color:#fff;border-bottom:4px solid var(--gold)}.hero .inner{max-width:1180px;margin:auto;padding:18px 22px}.brand{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.brand h1{margin:0;font-size:26px;letter-spacing:.01em}.brand p{margin:4px 0 0;color:#b9c7d8;font-size:12px}.nav{display:flex;gap:7px;flex-wrap:wrap}.nav a{color:#dbe5f1;text-decoration:none;border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:5px 9px;font-size:11px}.shell{max-width:1180px;margin:auto;padding:18px 22px 32px}.section{margin-bottom:19px}.section-title{font-size:18px;font-weight:780;margin:0 0 10px;display:flex;align-items:center;gap:8px}.section-title:before{content:"";width:4px;height:18px;background:var(--gold);border-radius:2px}.panel{background:var(--paper);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:13px}.conclusion{background:linear-gradient(180deg,#f4f7fb,#eef3f8);border-left:4px solid var(--gold);font-size:14px}.grid{display:grid;gap:10px}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:11px;min-width:0}.card.soft{background:var(--soft)}.kicker{font-size:11px;color:var(--muted)}.value{font-size:21px;font-weight:790;margin:2px 0}.up{color:var(--up)}.down{color:var(--down)}.neutral{color:var(--blue)}.warn{color:var(--warn)}.micro{font-size:10px;color:var(--muted)}.metrics{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin-top:9px}.metric{background:var(--soft);border-radius:8px;padding:8px}.metric b{display:block;font-size:14px}.rotation{display:grid;grid-template-columns:1fr 1fr;gap:10px}.bucket{border-radius:10px;padding:12px}.bucket.upbg{background:#fff1f1;border:1px solid #f3d4d5}.bucket.downbg{background:#edf8f3;border:1px solid #cfe8dd}.bucket h3{margin:0 0 7px;font-size:14px}.bucket ul{margin:0;padding-left:18px}.bucket li{margin:4px 0}.cross{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.cross .card{padding:10px}.events{display:grid;gap:8px}.event{display:grid;grid-template-columns:88px 1fr;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:9px;padding:9px;background:var(--paper)}.datepill{background:var(--navy);color:#fff;border-radius:7px;padding:5px 7px;font-size:11px;text-align:center}.event b{display:block;margin-bottom:2px}.event a{color:inherit;text-decoration:none}.calendar-group{background:var(--soft);border-radius:10px;padding:10px}.calendar-group h3{margin:0 0 7px;font-size:14px}.cal-row{display:flex;gap:10px;padding:6px 0;border-top:1px dashed var(--line)}.cal-row:first-of-type{border-top:0}.cal-date{width:58px;font-weight:700}.dims{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}.dim{border:1px solid var(--line);border-radius:9px;padding:9px;background:var(--paper)}.dim strong{display:block;font-size:15px}.themes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.theme{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--paper)}.theme h3{font-size:14px;margin:0 0 4px}.theme .state{font-size:12px;font-weight:700}.minirow{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:8px}.minirow div{background:var(--soft);border-radius:7px;padding:6px}.minirow b{display:block;font-size:12px}.outlook{display:grid;grid-template-columns:1fr 1fr;gap:10px}.scenario{border-radius:10px;padding:12px}.scenario.bull{background:#fff1f1;border:1px solid #f0d5d5}.scenario.bear{background:#edf8f3;border:1px solid #cce8dd}.scenario h3{margin:0 0 5px}.basecase{margin-top:9px;background:var(--soft);border-radius:9px;padding:10px}.table{overflow:auto}.table table{width:100%;border-collapse:collapse;min-width:760px}.table th,.table td{padding:8px;border-top:1px solid var(--line);text-align:right}.table th{font-size:10px;color:var(--muted)}.table th:first-child,.table td:first-child{text-align:left}.tag{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px 6px;font-size:10px;color:var(--muted)}.footer{font-size:10px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}.empty{color:var(--muted);font-size:12px;padding:8px 0}@media(max-width:900px){.g4,.cross,.themes{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr}.dims{grid-template-columns:repeat(3,1fr)}.metrics{grid-template-columns:repeat(3,1fr)}}@media(max-width:600px){.hero .inner,.shell{padding-left:12px;padding-right:12px}.brand{display:block}.nav{margin-top:10px}.g4,.g2,.rotation,.outlook,.cross,.themes{grid-template-columns:1fr 1fr}.dims{grid-template-columns:repeat(2,1fr)}.event{grid-template-columns:72px 1fr}.metrics{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header class="hero"><div class="inner"><div class="brand"><div><h1>Daily Flash · 每日投资驾驶舱</h1><p id="stamp">加载中…</p></div><nav class="nav"><a href="dashboard-v4.html">Decision Matrix</a><a href="dashboard-v3.html">完整工作台</a><a href="chart.html">K线</a><a href="performance.html">战绩</a><a href="portfolio.html">私人组合</a><a href="health.html">数据健康</a></nav></div></div></header>
<main class="shell">
<section class="section"><h2 class="section-title">今日核心结论</h2><div class="panel conclusion" id="conclusion">—</div></section>
<section class="section"><h2 class="section-title">指数与盘面总览</h2><div class="grid g4" id="indices"></div><div class="metrics" id="metrics"></div></section>
<section class="section"><h2 class="section-title">板块轮动</h2><div class="rotation"><div class="bucket upbg"><h3 class="up">领涨 / 净流入</h3><div id="leaders"></div></div><div class="bucket downbg"><h3 class="down">领跌 / 净流出</h3><div id="laggards"></div></div></div></section>
<section class="section"><h2 class="section-title">港股 · 美股 · 美债 · 大宗商品与汇率</h2><div class="cross" id="global"></div></section>
<section class="section"><h2 class="section-title">盘中关键事件</h2><div class="events" id="events"></div></section>
<section class="section"><h2 class="section-title">财报 / 催化日历</h2><div class="grid g3" id="calendar"></div></section>
<section class="section"><h2 class="section-title">多维度信号评分</h2><div class="dims" id="dimensions"></div></section>
<section class="section"><h2 class="section-title">主线跟踪</h2><div class="themes" id="themes"></div></section>
<section class="section"><h2 class="section-title">后市展望与风险</h2><div class="outlook"><div class="scenario bull"><h3 class="up">乐观情景</h3><div id="bull"></div></div><div class="scenario bear"><h3 class="down">悲观情景</h3><div id="bear"></div></div></div><div class="basecase" id="base"></div></section>
<section class="section"><h2 class="section-title">Decision Matrix · 研究复核优先级</h2><div class="panel table"><table><thead><tr><th>标的</th><th>方向</th><th>假设状态</th><th>Composite</th><th>Confluence</th><th>Conflict</th><th>Attention</th><th>当前研究重点</th></tr></thead><tbody id="matrix"></tbody></table></div></section>
<div class="footer" id="foot"></div>
</main>
<script>
const $=id=>document.getElementById(id), n=v=>Number.isFinite(Number(v))?Number(v):null, fmt=(v,d=2)=>n(v)==null?'—':n(v).toFixed(d), pct=v=>n(v)==null?'—':`${n(v)>0?'+':''}${n(v).toFixed(2)}%`, cls=v=>n(v)==null?'neutral':n(v)>0?'up':n(v)<0?'down':'neutral', esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const labels={bullish:'偏多',bearish:'偏空',neutral:'中性',mixed:'分化',confirmed:'已确认',supported:'获支持',contradicted:'受证伪',conflicted:'冲突',under_test:'待检验',emerging:'新方向',no_directional_thesis:'无方向',multi_layer_confirmed:'多层确认',partial_confirmation:'部分确认'};
function money(v){const x=n(v);if(x==null)return'—';if(Math.abs(x)>=1e12)return`${(x/1e12).toFixed(2)}万亿`;if(Math.abs(x)>=1e8)return`${(x/1e8).toFixed(1)}亿`;return x.toLocaleString('zh-CN')}
function renderIndices(D){const rows=D.market?.indices||[];$('indices').innerHTML=rows.slice(0,8).map(x=>`<div class="card"><div class="kicker">${esc(x.name)}</div><div class="value ${cls(x.change_pct)}">${pct(x.change_pct)}</div><div>${fmt(x.value,2)}</div><div class="micro">${esc(x.status||'—')}</div></div>`).join('')||'<div class="empty">指数数据待接入</div>';const m=D.market?.metrics||{},r=D.market?.risk||{},v=D.market?.valuation_hs300||{};const cards=[['上涨家数',m.up],['下跌家数',m.down],['涨停',m.limit_up],['跌停',m.limit_down],['两市成交额',money(m.turnover)],['风险温度',r.score==null?'—':`${fmt(r.score,0)} / 100`],['上涨占比',m.advance_ratio==null?'—':`${(m.advance_ratio*100).toFixed(1)}%`],['沪深300 PE',v.pe_ttm==null?'—':fmt(v.pe_ttm,2)],['10Y估值分位',v.percentile_10y==null?'—':`${fmt(v.percentile_10y,1)}%`],['封板率',m.seal_rate==null?'—':`${(m.seal_rate*100).toFixed(1)}%`]];$('metrics').innerHTML=cards.map(x=>`<div class="metric"><b>${esc(x[1])}</b><span class="micro">${esc(x[0])}</span></div>`).join('')}
function listRows(rows,flow=false){return rows.length?`<ul>${rows.map(x=>`<li><b>${esc(x.name||'—')}</b> ${x.change_pct==null?'':`<span class="${cls(x.change_pct)}">${pct(x.change_pct)}</span>`}${flow&&x.net_inflow!=null?` · ${money(x.net_inflow)}`:''}</li>`).join('')}</ul>`:'<div class="empty">暂无可用数据</div>'}
function renderRotation(D){const s=D.sector_rotation||{};$('leaders').innerHTML=listRows(s.leaders||[])+listRows(s.inflow||[],true);$('laggards').innerHTML=listRows(s.laggards||[])+listRows(s.outflow||[],true)}
function displayValue(x){if(x.value==null)return'—';if(x.unit==='yield')return`${fmt(x.value,3)}%`;if(x.unit==='fx')return fmt(x.value,4);if(x.unit==='usd')return`$${fmt(x.value,2)}`;return fmt(x.value,2)}
function renderGlobal(D){$('global').innerHTML=(D.global_markets||[]).map(x=>`<div class="card"><div class="kicker">${esc(x.group)} · ${esc(x.name)}</div><div class="value ${cls(x.change_pct)}">${pct(x.change_pct)}</div><div>${displayValue(x)}</div><div class="micro">${esc(x.status||'—')} · ${esc((x.as_of||'').slice(0,16))}</div></div>`).join('')||'<div class="empty">跨资产数据待接入</div>'}
function renderEvents(D){const rows=D.key_events||[];$('events').innerHTML=rows.length?rows.map(x=>`<div class="event"><div class="datepill">${esc((x.date||'—').slice(5,10)||'—')}</div><div>${x.source_url?`<a href="${esc(x.source_url)}" target="_blank" rel="noopener"><b>${esc(x.title)}</b></a>`:`<b>${esc(x.title)}</b>`}<div class="micro">${esc(x.impact||'暂无进一步影响描述')} ${x.direction?`· ${esc(x.direction)}`:''}</div></div></div>`).join(''):'<div class="panel empty">暂无新增材料性事件</div>'}
function renderCalendar(D){const rows=D.catalysts||[],now=new Date(),today=now.toISOString().slice(0,10),tomorrow=new Date(now.getTime()+86400000).toISOString().slice(0,10);const groups=[['今明两天',rows.filter(x=>x.date===today||x.date===tomorrow)],['未来10天',rows.filter(x=>x.date>tomorrow&&new Date(x.date)-now<=10*86400000)],['未来11–45天',rows.filter(x=>new Date(x.date)-now>10*86400000)]];$('calendar').innerHTML=groups.map(([title,items])=>`<div class="calendar-group"><h3>${title}</h3>${items.length?items.map(x=>`<div class="cal-row"><div class="cal-date">${esc((x.date||'').slice(5))}</div><div><b>${esc(x.title)}</b><div class="micro">${esc(x.type||'event')} · ${esc(x.source||'—')}</div></div></div>`).join(''):'<div class="empty">暂无已接入催化</div>'}</div>`).join('')}
function renderDimensions(D){$('dimensions').innerHTML=(D.dimensions||[]).map(x=>`<div class="dim"><div class="kicker">${esc(x.name)}</div><strong class="${x.label==='偏多'?'up':x.label==='偏空'?'down':'warn'}">${esc(x.label)}</strong><div class="micro">权重 ${esc(x.weight)} · Score ${x.score==null?'—':fmt(x.score,1)}</div><div class="micro">${esc(x.evidence)}</div></div>`).join('')}
function renderThemes(D){$('themes').innerHTML=(D.themes||[]).map(x=>`<div class="theme"><h3>${esc(x.theme)}</h3><div class="state ${x.status==='证据冲突'?'warn':x.status==='多层确认'||x.status==='方向获支持'?'up':'neutral'}">${esc(x.status)}</div><div class="micro">${esc((x.names||[]).join(' / '))}</div><div class="minirow"><div><b>${x.event_score==null?'—':fmt(x.event_score,0)}</b><span class="micro">事件</span></div><div><b>${x.technical_score==null?'—':fmt(x.technical_score,0)}</b><span class="micro">技术</span></div><div><b>${x.industry_score==null?'—':fmt(x.industry_score,0)}</b><span class="micro">行业</span></div></div></div>`).join('')}
function renderMatrix(D){$('matrix').innerHTML=(D.matrix_focus||[]).map(x=>`<tr><td><b>${esc(x.name)}</b><div class="micro">${esc(x.code)}</div></td><td>${esc(labels[x.direction]||x.direction||'—')}</td><td>${esc(labels[x.thesis_state]||x.thesis_state||'—')}</td><td class="${cls(x.composite_score)}">${fmt(x.composite_score,1)}</td><td>${fmt(x.confluence,1)}</td><td>${fmt(x.conflict_score,1)}</td><td>${fmt(x.attention_score,1)}</td><td style="text-align:left;white-space:normal">${esc(x.focus||'—')}</td></tr>`).join('')||'<tr><td colspan="8" class="empty">Decision Matrix待刷新</td></tr>'}
fetch('daily_flash.json',{cache:'no-store'}).then(r=>r.json()).then(D=>{$('stamp').textContent=`${D.generated_at||'—'} · 数据源：Market State / Risk / Valuation / Decision Matrix / Global / AI Signals`;$('conclusion').textContent=D.core_conclusion||'暂无核心结论';renderIndices(D);renderRotation(D);renderGlobal(D);renderEvents(D);renderCalendar(D);renderDimensions(D);renderThemes(D);$('bull').textContent=D.outlook?.bullish||'—';$('bear').textContent=D.outlook?.bearish||'—';$('base').textContent=D.outlook?.base||'—';renderMatrix(D);$('foot').textContent=`${D.boundary||''} · Sources: ${Object.entries(D.sources||{}).map(([k,v])=>`${k}=${v||'—'}`).join(' / ')}`}).catch(e=>{$('conclusion').textContent='Daily Flash 数据加载失败，请进入数据健康页检查。';console.error(e)})
</script>
</body></html>
